name: Fix unified auth config

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-auth-unified-config.yml'

permissions:
  contents: write

jobs:
  fix_auth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python .github/fix-auth-unified-config.py

      - name: Validate
        run: |
          node --check js/supabase-auth.js
          node --check api/_lib.js
          node --check api/auth-config.js
          grep -q "_loadRuntimeConfig" js/supabase-auth.js
          grep -q "SUPABASE_CONFIG_SOURCE" api/_lib.js
          grep -q "projectRef" api/auth-config.js

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-auth-unified-config.yml .github/fix-auth-unified-config.py
          git add -A
          git commit -m "fix: 统一 Supabase 登录与后端配置 [auth-unified-config]"
          git push
