name: Apply premium UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[premium-ui-v3]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply premium design system
        run: python3 .ui-upgrade/apply.py

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in js/*.js api/*.js; do node --check "$f" >/dev/null; done

      - name: Validate markup and assets
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'viewport-fit=cover' index.html
          grep -q '密码（至少8位）' index.html
          grep -q 'Premium System V3' css/style.css
          grep -q 'initPremiumMaterialUI' js/app.js
          ! grep -q 'background:#3cb371' index.html

      - name: Commit integrated UI
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .ui-upgrade
          rm -f .github/workflows/apply-premium-ui.yml
          git config user.name "DaoWen Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: Apple级东方高级UI、乱码与按键布局修复 [premium-ui-v3]"
          git push origin HEAD:main
