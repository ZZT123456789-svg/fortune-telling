name: Apply Auth State Repair

on:
  push:
    paths:
      - '.github/workflows/apply-auth-state.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply auth state patch
        run: python3 .auth-state-fix.py

      - name: Validate auth JavaScript
        run: |
          node --check js/supabase-auth.js
          grep -q '_applySignupActions' js/supabase-auth.js
          grep -q "success: true," js/supabase-auth.js
          grep -q "existing_or_ambiguous" js/supabase-auth.js
          grep -q "使用原密码登录" js/supabase-auth.js

      - name: Commit auth repair
        run: |
          git config user.name "DaoWen Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .auth-state-fix.py .github/workflows/apply-auth-state.yml
          git add js/supabase-auth.js
          git commit -m "fix: 完善重复注册与验证状态登录流程 [auth-state-v3]"
          git push origin HEAD:main
