'''
          css.write_text(c, encoding='utf-8')

          # basic validation
          html = index.read_text(encoding='utf-8')
          css_text = css.read_text(encoding='utf-8')
          assert html.count('id="paywallShopOverlay"') == 1
          assert '免费用户' not in html[html.find('id="paywallShopOverlay"'):html.find('id="paywallRedeemOverlay"')]
          assert '约 ¥1.00 / 次' in html
          assert css_text.count('{') == css_text.count('}')
          print('premium paywall applied and validated')
          PY

