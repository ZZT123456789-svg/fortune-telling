name: Apply Premium Paywall

on:
  push:
    paths:
      - '.github/workflows/apply-premium-paywall.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply approved paywall design
        run: python3 .premium-paywall-apply.py

      - name: Validate files
        run: |
          grep -q 'pw-premium-title' index.html
          grep -q '道问 Premium Paywall 2026' css/style.css
          grep -q '约 ¥1.00 / 次' index.html
          ! grep -A100 'id="paywallShopOverlay"' index.html | grep -q '免费用户'

      - name: Commit approved paywall UI
        run: |
          git config user.name "DaoWen Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-premium-paywall.yml .premium-paywall-apply.py
          git add index.html css/style.css
          git commit -m "ui: 升级黑金东方高级付费墙 [premium-paywall]"
          git push origin HEAD:main
