name: Apply Premium Paywall

on:
  push:
    paths:
      - '.github/workflows/apply-premium-paywall.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply approved paywall design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          start_marker = '  <!-- ====== 付费墙弹窗 ====== -->\n  <div class="tool-overlay" id="paywallShopOverlay">'
          end_marker = '\n\n  <div class="tool-overlay" id="paywallRedeemOverlay">'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('paywall block not found')

          new_block = '''  <!-- ====== 付费墙弹窗 ====== -->
  <div class="tool-overlay" id="paywallShopOverlay">
    <div class="tool-modal pw-premium-modal">
      <button class="modal-close" onclick="Paywall.closeShop()" aria-label="关闭">✕</button>
      <div class="pw-premium-shell">
        <div class="pw-premium-topline">
          <span class="pw-lock-badge">付费解锁</span>
          <span class="pw-balance-pill">当前剩余 <b data-daowen-balance>—</b> 次</span>
        </div>

        <div class="pw-premium-eyebrow"><span>☯</span> 解锁完整命理智慧 <span>✦</span></div>
        <h2 class="pw-premium-title">开启你的命运新篇章</h2>
        <p class="pw-premium-subtitle">购买解读次数，深度解析命盘与卦象；次数绑定当前账号，到账以服务端确认结果为准。</p>

        <div class="pw-benefits">
          <div class="pw-benefit"><i>◈</i><div><strong>深度命理解读</strong><span>八字、紫微与占卜结果通用</span></div></div>
          <div class="pw-benefit"><i>▥</i><div><strong>结构化分析</strong><span>从格局、趋势到行动提醒</span></div></div>
          <div class="pw-benefit"><i>卷</i><div><strong>专属解读建议</strong><span>按本次排盘与问题生成内容</span></div></div>
          <div class="pw-benefit"><i>印</i><div><strong>账号云端绑定</strong><span>购买与剩余次数跟随登录账号</span></div></div>
        </div>

        <div class="shop-grid pw-plan-grid">
          <div class="shop-card pw-plan-card" onclick="showBuyContact(3)">
            <div class="pw-card-kicker">轻量体验</div>
            <div class="sc-count">3 次解读</div>
            <div class="sc-price"><small>¥</small>4.9</div>
            <div class="sc-unit">约 ¥1.63 / 次</div>
            <ul class="pw-plan-list">
              <li>完整 AI 深度解读</li>
              <li>多种命理工具通用</li>
              <li>次数永久有效</li>
            </ul>
            <span class="pw-plan-action">立即解锁</span>
          </div>

          <div class="shop-card best pw-plan-card pw-plan-featured" onclick="showBuyContact(10)">
            <span class="pw-ribbon">超值推荐</span>
            <div class="pw-card-kicker">常用推荐</div>
            <div class="sc-count">10 次解读</div>
            <div class="sc-price"><small>¥</small>9.9</div>
            <div class="sc-unit">约 ¥0.99 / 次</div>
            <ul class="pw-plan-list">
              <li>适合连续深度解读</li>
              <li>八字 / 紫微 / 占卜通用</li>
              <li>次数永久有效</li>
            </ul>
            <span class="pw-plan-action">立即购买</span>
          </div>

          <div class="shop-card pw-plan-card" onclick="showBuyContact(20)">
            <div class="pw-card-kicker">高频使用</div>
            <div class="sc-count">20 次解读</div>
            <div class="sc-price"><small>¥</small>19.9</div>
            <div class="sc-unit">约 ¥1.00 / 次</div>
            <ul class="pw-plan-list">
              <li>减少重复购买操作</li>
              <li>多种命理工具通用</li>
              <li>次数永久有效</li>
            </ul>
            <span class="pw-plan-action">立即购买</span>
          </div>
        </div>

        <div class="pw-assurance">
          <div><i>盾</i><span><b>账号绑定</b><small>购买记录跟随账号</small></span></div>
          <div><i>验</i><span><b>服务端确认</b><small>支付到账以后端结果为准</small></span></div>
          <div><i>付</i><span><b>支付宝支付</b><small>创建订单后跳转支付</small></span></div>
          <div><i>码</i><span><b>支持兑换码</b><small>已有兑换码可直接兑换</small></span></div>
        </div>

        <div class="pw-premium-footer">
          <span>已有兑换码？</span>
          <a href="javascript:Paywall.openRedeem();Paywall.closeShop();">立即兑换</a>
        </div>
      </div>
    </div>
  </div>'''

          text = text[:start] + new_block + text[end:]
          index.write_text(text, encoding='utf-8')

          css = Path('css/style.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* ===== 道问 Premium Paywall 2026 ===== */'
          if marker not in c:
              c += r'''

