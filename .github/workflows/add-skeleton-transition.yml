name: Add skeleton transition

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skeleton-transition]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Patch original UI files
        run: python3 .github/patch-skeleton.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          grep -q "宣纸骨架屏过渡" js/app.js
          grep -q "DAO SKELETON TRANSITIONS" css/style.css
          python3 -c "from pathlib import Path; s=Path('css/style.css').read_text(encoding='utf-8'); assert s.count('{') == s.count('}'), 'CSS braces mismatch'"

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/patch-skeleton.py
          rm -f .github/workflows/add-skeleton-transition.yml
          git config user.name "DaoWen Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: 加入宣纸骨架屏过渡动画 [skeleton-transition]"
          git push origin HEAD:main
